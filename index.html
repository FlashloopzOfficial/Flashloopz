<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        body {
    margin: 0;
    padding: 0;
    background-color: #ff4d4d; /* Красный фон из примера */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 15px;
}

.flash-wrapper {
    width: 1320px;
    height: 644px;
    background-color: white;
    border: 1.5px solid black;
    display: flex;
    justify-content: center;
    align-items: center;
}

.controls {
    display: flex;
    gap: 30px;
    align-items: center;
}

/* Стили для кнопок (замените background на ваши картинки) */
button {
    background: none;
    border: none;
    cursor: pointer;
    width: 100px;
    height: 50px;
}
 </style>
</head>
<body>

    <div class="container">
        <!-- Место под логотип -->
        <header class="logo">
           <img src = "flashloopz_logo.png" width="30%" height="30%" alt="Логотип">
        </header>

        <!-- Контейнер для флеш-плеера -->
        <main class="flash-wrapper">
            <embed src="плоломобилье.swf" width="1320px" height="644">
        </main>

        <!-- Панель управления -->
        <footer class="controls">
           <button type="button">
  <img src="button_flashloopz.png" alt="кнопко1" style="width: 80%; height: 80%;">
</button>
            <button type="button">
  <img src="random_button_flashloopz.png" alt="рандом" style="width: 27%; height: 80
    %;">
</button>
            <button type="button">
  <img src="button_flashloopz2.png" alt="кнопко2" style="width: 80%; height: 80%;">
</button>
        </footer>
    </div>

</body>
</html>
